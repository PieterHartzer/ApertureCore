# Checks every push and pull request: types and tests.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2

      - name: Install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test
