# Throwaway databases for the adapter integration suite:
#   docker compose -f docker-compose.test-db.yml up -d --wait
#   RUN_DB_INTEGRATION=1 pnpm exec vitest run tests/integration
#   docker compose -f docker-compose.test-db.yml down -v
name: autodash-test-db

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: autodash_test
      POSTGRES_PASSWORD: TestAdmin1!
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d autodash_test"]
      interval: 3s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: autodash_test
      MYSQL_ROOT_PASSWORD: TestAdmin1!
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -uroot -pTestAdmin1! -e 'select 1'"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: autodash_test
      MARIADB_ROOT_PASSWORD: TestAdmin1!
    ports:
      - "127.0.0.1:13307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: TestAdmin1!
      MSSQL_PID: Developer
    ports:
      - "127.0.0.1:11433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TestAdmin1!' -Q 'select 1' -b"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
